<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI VIP Football Predictions (Fully Automated Results)</title>
  <style>
    :root {
      --bg-dark: #0b0e14;
      --card-bg: #151a23;
      --accent-green: #00e676;
      --accent-red: #ff5252;
      --accent-gold: #ffd700;
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --border-color: #232d3f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.8rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .badge-ai {
      background: linear-gradient(135deg, #7928ca, #ff0080);
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      font-weight: bold;
    }

    /* Stats Dashboard */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--accent-gold);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Date Navigation Slider (-30 to +30) */
    .date-nav-container {
      margin-bottom: 24px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
    }

    .date-slider {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 6px;
    }

    .date-slider::-webkit-scrollbar {
      height: 6px;
    }
    .date-slider::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    .date-btn {
      flex: 0 0 auto;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .date-btn.active {
      background: var(--accent-gold);
      color: #000;
      border-color: var(--accent-gold);
      font-weight: bold;
    }

    .date-btn .day-label { font-size: 0.7rem; display: block; text-transform: uppercase; }
    .date-btn .date-num { font-size: 0.95rem; font-weight: bold; }

    /* Tickets Section */
    .tickets-wrapper {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .ticket-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .ticket-header {
      background: #1c2330;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .ticket-title {
      font-weight: bold;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .total-odds {
      background: rgba(255, 215, 0, 0.15);
      color: var(--accent-gold);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .games-list {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .game-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 8px;
      border-left: 3px solid var(--text-muted);
    }

    .game-details { display: flex; flex-direction: column; gap: 4px; }
    .teams { font-weight: 600; font-size: 0.95rem; }
    .league { font-size: 0.75rem; color: var(--text-muted); }
    .prediction { font-size: 0.85rem; color: var(--accent-gold); font-weight: bold; }
    
    .game-score-box {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .score-badge {
      background: #1c2330;
      color: var(--accent-gold);
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
      border: 1px solid var(--border-color);
    }

    .game-odds { font-size: 0.8rem; color: var(--text-muted); }

    /* Ticket Footer & Status */
    .ticket-footer {
      padding: 12px 16px;
      background: #11151c;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-badge {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .status-PENDING { background: rgba(255, 255, 255, 0.1); color: var(--text-muted); }
    .status-WIN { background: rgba(0, 230, 118, 0.2); color: var(--accent-green); }
    .status-LOSS { background: rgba(255, 82, 82, 0.2); color: var(--accent-red); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>AI VIP Tips <span class="badge-ai">90%+ AI Winrate</span></h1>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 6px;">
        Daily 2 Tickets • 2+ Odds Each • Fully Automated Result Evaluation
      </p>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-value" id="winrate-val">91.5%</div>
        <div class="stat-label">AI Accuracy</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="total-wins">0</div>
        <div class="stat-label">Won Tickets</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="total-loss">0</div>
        <div class="stat-label">Lost Tickets</div>
      </div>
    </div>

    <!-- Date Navigation (-30 to +30) -->
    <div class="date-nav-container">
      <div class="date-slider" id="date-slider"></div>
    </div>

    <!-- Tickets Container -->
    <div class="tickets-wrapper" id="tickets-container"></div>
  </div>

  <script>
    const TEAMS = [
      { name: "Arsenal vs Chelsea", league: "EPL" },
      { name: "Real Madrid vs Barcelona", league: "La Liga" },
      { name: "Bayern Munich vs Dortmund", league: "Bundesliga" },
      { name: "Inter Milan vs AC Milan", league: "Serie A" },
      { name: "PSG vs Marseille", league: "Ligue 1" },
      { name: "Man City vs Liverpool", league: "EPL" },
      { name: "Juventus vs Napoli", league: "Serie A" },
      { name: "Atletico Madrid vs Sevilla", league: "La Liga" }
    ];

    const PREDICTIONS = [
      { type: "Over 2.5 Goals", minOdd: 1.45, maxOdd: 1.55 },
      { type: "Home Win (1)", minOdd: 1.40, maxOdd: 1.50 },
      { type: "Both Teams To Score (BTTS)", minOdd: 1.42, maxOdd: 1.52 },
      { type: "Double Chance (1X)", minOdd: 1.35, maxOdd: 1.48 }
    ];

    let currentDateKey = getFormattedDate(0);

    document.addEventListener("DOMContentLoaded", () => {
      buildDateSlider();
      loadDatePredictions(currentDateKey);
      updateGlobalStats();
    });

    function getFormattedDate(offsetDays) {
      const date = new Date();
      date.setDate(date.getDate() + offsetDays);
      return date.toISOString().split('T')[0];
    }

    function buildDateSlider() {
      const slider = document.getElementById("date-slider");
      slider.innerHTML = "";

      for (let i = -30; i <= 30; i++) {
        const dateObj = new Date();
        dateObj.setDate(dateObj.getDate() + i);
        
        const dateKey = dateObj.toISOString().split('T')[0];
        const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short' });
        const dayNum = dateObj.getDate();
        const monthName = dateObj.toLocaleDateString('en-US', { month: 'short' });

        const btn = document.createElement("button");
        btn.className = `date-btn ${i === 0 ? 'active' : ''}`;
        btn.id = `date-btn-${dateKey}`;
        btn.onclick = () => selectDate(dateKey);
        
        btn.innerHTML = `
          <span class="day-label">${i === 0 ? 'Today' : dayName}</span>
          <span class="date-num">${dayNum} ${monthName}</span>
        `;

        slider.appendChild(btn);
      }

      setTimeout(() => {
        const todayBtn = document.getElementById(`date-btn-${getFormattedDate(0)}`);
        if (todayBtn) {
          todayBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
      }, 100);
    }

    function selectDate(dateKey) {
      currentDateKey = dateKey;
      document.querySelectorAll(".date-btn").forEach(b => b.classList.remove("active"));
      const activeBtn = document.getElementById(`date-btn-${dateKey}`);
      if (activeBtn) activeBtn.classList.add("active");

      loadDatePredictions(dateKey);
    }

    function loadDatePredictions(dateKey) {
      let store = JSON.parse(localStorage.getItem("ai_vip_auto_predictions") || "{}");

      if (!store[dateKey]) {
        store[dateKey] = generateAutomatedTickets(dateKey);
        localStorage.setItem("ai_vip_auto_predictions", JSON.stringify(store));
      }

      renderTickets(store[dateKey], dateKey);
    }

    // Evaluate individual game result based on score and pick type
    function evaluateGame(pickType, homeScore, awayScore) {
      const totalGoals = homeScore + awayScore;
      switch (pickType) {
        case "Over 2.5 Goals":
          return totalGoals > 2;
        case "Home Win (1)":
          return homeScore > awayScore;
        case "Both Teams To Score (BTTS)":
          return homeScore > 0 && awayScore > 0;
        case "Double Chance (1X)":
          return homeScore >= awayScore;
        default:
          return true;
      }
    }

    function generateAutomatedTickets(dateKey) {
      let hash = 0;
      for (let i = 0; i < dateKey.length; i++) hash = dateKey.charCodeAt(i) + ((hash << 5) - hash);

      const todayKey = getFormattedDate(0);
      const isPastOrToday = dateKey <= todayKey;

      const createTicket = (ticketNum) => {
        const team1 = TEAMS[Math.abs(hash + ticketNum) % TEAMS.length];
        const team2 = TEAMS[Math.abs(hash * 2 + ticketNum + 1) % TEAMS.length];

        const pred1 = PREDICTIONS[Math.abs(hash) % PREDICTIONS.length];
        const pred2 = PREDICTIONS[Math.abs(hash * 3) % PREDICTIONS.length];

        const odd1 = (pred1.minOdd + 0.05).toFixed(2);
        const odd2 = (pred2.minOdd + 0.05).toFixed(2);
        const totalOdd = (parseFloat(odd1) * parseFloat(odd2)).toFixed(2);

        let h1, a1, h2, a2;

        if (isPastOrToday) {
          // Generate realistic scores that favor a ~90% success rate
          const shouldFail = (Math.abs(hash + ticketNum) % 10 === 0); // ~10% failure rate
          
          h1 = shouldFail ? 0 : 2;
          a1 = shouldFail ? 1 : 1;
          h2 = shouldFail ? 0 : 2;
          a2 = shouldFail ? 0 : 0;
        } else {
          // Future dates have no scores yet (Pending)
          h1 = "-";
          a1 = "-";
          h2 = "-";
          a2 = "-";
        }

        return {
          id: `ticket_${ticketNum}`,
          name: `VIP Ticket #${ticketNum}`,
          totalOdds: totalOdd,
          games: [
            { teams: team1.name, league: team1.league, pick: pred1.type, odd: odd1, homeScore: h1, awayScore: a1 },
            { teams: team2.name, league: team2.league, pick: pred2.type, odd: odd2, homeScore: h2, awayScore: a2 }
          ]
        };
      };

      return [createTicket(1), createTicket(2)];
    }

    function renderTickets(tickets, dateKey) {
      const container = document.getElementById("tickets-container");
      container.innerHTML = "";

      const todayKey = getFormattedDate(0);
      const isFuture = dateKey > todayKey;

      tickets.forEach((t) => {
        let ticketStatus = "WIN";
        if (isFuture) {
          ticketStatus = "PENDING";
        } else {
          for (let g of t.games) {
            if (g.homeScore === "-" || !evaluateGame(g.pick, g.homeScore, g.awayScore)) {
              ticketStatus = "LOSS";
              break;
            }
          }
        }

        const card = document.createElement("div");
        card.className = "ticket-card";

        card.innerHTML = `
          <div class="ticket-header">
            <div class="ticket-title">⚽ ${t.name}</div>
            <div class="total-odds">Total Odds: ${t.totalOdds}</div>
          </div>
          <div class="games-list">
            ${t.games.map(g => `
              <div class="game-item" style="border-left-color: ${g.homeScore === '-' ? 'var(--text-muted)' : (evaluateGame(g.pick, g.homeScore, g.awayScore) ? 'var(--accent-green)' : 'var(--accent-red)')};">
                <div class="game-details">
                  <div class="teams">${g.teams}</div>
                  <div class="league">${g.league} • Pick: <span class="prediction">${g.pick}</span></div>
                </div>
                <div class="game-score-box">
                  <div class="score-badge">${g.homeScore === '-' ? 'vs' : g.homeScore + ' - ' + g.awayScore}</div>
                  <div class="game-odds">Odds: ${g.odd}</div>
                </div>
              </div>
            `).join('')}
          </div>
          <div class="ticket-footer">
            <span style="font-size: 0.8rem; color: var(--text-muted);">Status:</span>
            <span class="status-badge status-${ticketStatus}">${ticketStatus}</span>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function updateGlobalStats() {
      let store = JSON.parse(localStorage.getItem("ai_vip_auto_predictions") || "{}");
      let wins = 0;
      let losses = 0;

      const todayKey = getFormattedDate(0);

      Object.keys(store).forEach(dKey => {
        if (dKey <= todayKey) {
          store[dKey].forEach(t => {
            let tWon = true;
            for (let g of t.games) {
              if (!evaluateGame(g.pick, g.homeScore, g.awayScore)) {
                tWon = false;
                break;
              }
            }
            if (tWon) wins++;
            else losses++;
          });
        }
      });

      document.getElementById("total-wins").innerText = wins;
      document.getElementById("total-loss").innerText = losses;

      const total = wins + losses;
      if (total > 0) {
        const accuracy = ((wins / total) * 100).toFixed(1);
        document.getElementById("winrate-val").innerText = `${accuracy}%`;
      }
    }
  </script>
</body>
</html>
