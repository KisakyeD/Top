<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Workspace - Powered by Gemini</title>
    <style>
        :root {
            --bg-color: #131314;
            --sidebar-bg: #1e1f20;
            --text-color: #e3e3e3;
            --text-secondary: #c4c7c5;
            --input-bg: #1e1f20;
            --border-color: #333537;
            --accent-color: #8ab4f8;
            --user-bubble: #2d2f31;
            --ai-bubble: #1e1f20;
        }

        [data-theme="light"] {
            --bg-color: #ffffff;
            --sidebar-bg: #f0f4f9;
            --text-color: #1f1f1f;
            --text-secondary: #5e5e5e;
            --input-bg: #f0f4f9;
            --border-color: #d1d5db;
            --accent-color: #0b57d0;
            --user-bubble: #f0f4f9;
            --ai-bubble: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        body { display: flex; }

        sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
            flex-shrink: 0;
        }

        .new-chat-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            margin-bottom: 16px;
        }

        .api-key-box {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .api-key-box label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .api-key-box input {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        .sidebar-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 16px;
            padding: 6px;
            border-radius: 50%;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: relative;
        }

        header {
            height: 56px;
            padding: 0 20px;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background-color: var(--bg-color);
            z-index: 10;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            display: flex;
            gap: 12px;
            width: 100%;
            line-height: 1.5;
            font-size: 15px;
            align-items: flex-start;
        }

        .message.user { flex-direction: row-reverse; }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            color: white;
            flex-shrink: 0;
        }

        .message.user .avatar { background: #555; }

        .bubble {
            background-color: var(--ai-bubble);
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            max-width: 80%;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message.user .bubble {
            background-color: var(--user-bubble);
            border-bottom-right-radius: 4px;
        }

        .message.ai .bubble { border-bottom-left-radius: 4px; }

        .input-area {
            padding: 12px 16px 20px 16px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            flex-shrink: 0;
            background-color: var(--bg-color);
        }

        .input-box {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 6px 12px 6px 16px;
            gap: 8px;
        }

        .input-box textarea {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 15px;
            resize: none;
            max-height: 120px;
            outline: none;
            padding: 6px 0;
        }

        .send-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            sidebar { display: none; }
        }
    </style>
</head>
<body>

    <sidebar>
        <button class="new-chat-btn" onclick="clearChat()">+ New Chat</button>
        <div class="api-key-box">
            <label for="apiKeyInput">Gemini API Key:</label>
            <input type="password" id="apiKeyInput" placeholder="Paste key here" onchange="saveKey()">
        </div>
        <div class="sidebar-footer">
            <span>Theme</span>
            <button class="theme-toggle" class="themeToggleBtn" onclick="toggleTheme()">☀️</button>
        </div>
    </sidebar>

    <div class="main-container">
        <header>
            <span>Gemini AI Chat</span>
            <button class="theme-toggle" onclick="toggleTheme()">☀️</button>
        </header>
        
        <div class="chat-history" id="chatHistory">
            <div class="message ai">
                <div class="avatar">AI</div>
                <div class="bubble">Hello! Enter your free Gemini API Key to start real AI conversations.</div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-box">
                <textarea id="userInput" placeholder="Ask Gemini anything..." rows="1" onkeydown="handleKey(event)"></textarea>
                <button class="send-btn" onclick="sendMessage()">&#8593;</button>
            </div>
        </div>
    </div>

    <script>
        const chatHistory = document.getElementById('chatHistory');
        const userInput = document.getElementById('userInput');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const themeToggleBtns = document.querySelectorAll('.theme-toggle');
        const htmlElement = document.documentElement;

        let conversationHistory = [];

        // Load saved API key on startup
        window.onload = () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) apiKeyInput.value = savedKey;
        };

        function saveKey() {
            localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
        }

        function toggleTheme() {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            htmlElement.setAttribute('data-theme', newTheme);
            themeToggleBtns.forEach(btn => {
                btn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
            });
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            let apiKey = apiKeyInput.value.trim() || localStorage.getItem('gemini_api_key');
            
            if (!apiKey) {
                apiKey = prompt("Please enter your free Google Gemini API Key to chat:");
                if (apiKey) {
                    apiKeyInput.value = apiKey.trim();
                    saveKey();
                } else {
                    alert("An API key is required to talk to Gemini!");
                    return;
                }
            }

            // Append User Message
            appendMessage(text, 'user');
            userInput.value = '';

            // Append Loading Bubble for AI
            const loadingDiv = appendMessage("Thinking...", 'ai');

            // Save user message to context history
            conversationHistory.push({ role: "user", parts: [{ text: text }] });

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: conversationHistory })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    loadingDiv.querySelector('.bubble').textContent = aiReply;
                    conversationHistory.push({ role: "model", parts: [{ text: aiReply }] });
                } else if (data.error) {
                    loadingDiv.querySelector('.bubble').textContent = "API Error: " + data.error.message;
                } else {
                    loadingDiv.querySelector('.bubble').textContent = "Sorry, I couldn't process that request.";
                }
            } catch (err) {
                loadingDiv.querySelector('.bubble').textContent = "Connection error. Please check your API key or network connection.";
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = sender === 'user' ? 'U' : 'AI';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;

            msgDiv.appendChild(avatar);
            msgDiv.appendChild(bubble);
            chatHistory.appendChild(msgDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            return msgDiv;
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function clearChat() {
            conversationHistory = [];
            chatHistory.innerHTML = `
                <div class="message ai">
                    <div class="avatar">AI</div>
                    <div class="bubble">New chat started! Ask me anything.</div>
                </div>
            `;
        }
    </script>
</body>
</html>
