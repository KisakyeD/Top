<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Workspace</title>
    <style>
        :root {
            --bg-color: #131314;
            --sidebar-bg: #1e1f20;
            --text-color: #e3e3e3;
            --text-secondary: #c4c7c5;
            --input-bg: #1e1f20;
            --border-color: #333537;
            --accent-color: #8ab4f8;
            --user-bubble: #2d2f31;
            --ai-bubble: #1e1f20;
        }

        [data-theme="light"] {
            --bg-color: #ffffff;
            --sidebar-bg: #f0f4f9;
            --text-color: #1f1f1f;
            --text-secondary: #5e5e5e;
            --input-bg: #f0f4f9;
            --border-color: #d1d5db;
            --accent-color: #0b57d0;
            --user-bubble: #f0f4f9;
            --ai-bubble: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        body {
            display: flex;
        }

        /* Sidebar */
        sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
            transition: background-color 0.3s;
            flex-shrink: 0;
        }

        .new-chat-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            margin-bottom: 24px;
        }

        .sidebar-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 16px;
            padding: 6px;
            border-radius: 50%;
        }

        /* Main Container */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height for mobile browsers */
            overflow: hidden;
            position: relative;
        }

        header {
            height: 56px;
            padding: 0 20px;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background-color: var(--bg-color);
            z-index: 10;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            display: flex;
            gap: 12px;
            width: 100%;
            line-height: 1.5;
            font-size: 15px;
            align-items: flex-start;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            color: white;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: #555;
        }

        .bubble {
            background-color: var(--ai-bubble);
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            max-width: 80%;
            word-break: break-word;
        }

        .message.user .bubble {
            background-color: var(--user-bubble);
            border-bottom-right-radius: 4px;
        }

        .message.ai .bubble {
            border-bottom-left-radius: 4px;
        }

        /* Input Area */
        .input-area {
            padding: 12px 16px 20px 16px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            flex-shrink: 0;
            background-color: var(--bg-color);
        }

        .input-box {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 6px 12px 6px 16px;
            gap: 8px;
        }

        .input-box textarea {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 15px;
            resize: none;
            max-height: 120px;
            outline: none;
            padding: 6px 0;
        }

        .send-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            sidebar { display: none; }
        }
    </style>
</head>
<body>

    <sidebar>
        <button class="new-chat-btn" onclick="clearChat()">+ New Chat</button>
        <div style="flex:1; overflow-y:auto; font-size:14px; color:var(--text-secondary);">
            <p style="padding: 6px 0;">Recent Conversations</p>
        </div>
        <div class="sidebar-footer">
            <span>Theme</span>
            <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">☀️</button>
        </div>
    </sidebar>

    <div class="main-container">
        <header>
            <span>AI Assistant Pro</span>
            <button class="theme-toggle" onclick="toggleTheme()" style="display: inline-block;">☀️</button>
        </header>
        
        <div class="chat-history" id="chatHistory">
            <div class="message ai">
                <div class="avatar">AI</div>
                <div class="bubble">Hello! I am your custom AI interface. How can I help you build or code today?</div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-box">
                <textarea id="userInput" placeholder="Ask anything..." rows="1" onkeydown="handleKey(event)"></textarea>
                <button class="send-btn" onclick="sendMessage()">&#8593;</button>
            </div>
        </div>
    </div>

    <script>
        const chatHistory = document.getElementById('chatHistory');
        const userInput = document.getElementById('userInput');
        const themeToggleBtns = document.querySelectorAll('.theme-toggle');
        const htmlElement = document.documentElement;

        function toggleTheme() {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            htmlElement.setAttribute('data-theme', newTheme);
            themeToggleBtns.forEach(btn => {
                btn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
            });
        }

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';
            
            setTimeout(() => {
                appendMessage("I received your message: \"" + text + "\". You can wire this frontend up to an LLM API endpoint (like OpenAI, Gemini, or a local backend)!", 'ai');
            }, 600);
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = sender === 'user' ? 'U' : 'AI';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;

            msgDiv.appendChild(avatar);
            msgDiv.appendChild(bubble);
            chatHistory.appendChild(msgDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function clearChat() {
            chatHistory.innerHTML = `
                <div class="message ai">
                    <div class="avatar">AI</div>
                    <div class="bubble">New session started. What's on your mind?</div>
                </div>
            `;
        }
    </script>
</body>
</html>
